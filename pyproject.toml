[project]
name = "osm-timelapse"
version = "0.1.0"
description = "Create historical timelapse renders of OpenStreetMap data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "mercantile>=1.2",
    "Pillow>=10.0",
    "requests>=2.33.1",
]

[project.scripts]
osm-timelapse = "osm_timelapse.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osm_timelapse"]
